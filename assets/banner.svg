<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<style>
.bg0{stop-color:#f4f7fc}.bg1{stop-color:#ece9f6}
.t{fill:#1f2328}.m{fill:#4d5761}.chip{fill:#ffffff;stroke:#d3d8e6}.chipt{fill:#3a3f45}
.skull{stroke:#b9c0d4;fill:#ffffff}.lab{fill:#6b7280}
.h0{stop-color:#fff3b0}.h1{stop-color:#f4a259}.h2{stop-color:#d1495b}
@media (prefers-color-scheme:dark){
.bg0{stop-color:#151a24}.bg1{stop-color:#1b1726}
.t{fill:#f0f3f6}.m{fill:#a3acb5}.chip{fill:#1c2128;stroke:#343a4a}.chipt{fill:#d6dbe0}
.skull{stroke:#3a4152;fill:#0f131a}.lab{fill:#8b93a1}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg0"/><stop offset="1" class="bg1"/></linearGradient>
<radialGradient id="heat"><stop offset="0" class="h0"/><stop offset=".6" class="h1"/><stop offset="1" class="h2" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/></filter>
<clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
<!-- one striatum: caudate head + putamen tail (a comma) -->
<g id="comma"><circle cx="0" cy="0" r="15" fill="url(#heat)"/><ellipse cx="14" cy="30" rx="12" ry="27" transform="rotate(-24 14 30)" fill="url(#heat)"/></g>
<g id="period"><circle cx="0" cy="0" r="15" fill="url(#heat)"/></g>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="340" fill="url(#bg)"/>

<!-- normal scan: two commas -->
<g transform="translate(790 168)">
<ellipse rx="96" ry="118" class="skull" stroke-width="2"/>
<g filter="url(#glow)" transform="scale(1.6)"><use href="#comma" x="20" y="-22"/><use href="#comma" transform="scale(-1 1)" x="20" y="-22"/></g>
<text y="148" class="lab" font-size="14" text-anchor="middle" letter-spacing="1">NORMAL · COMMAS</text>
</g>
<!-- abnormal scan: commas shrink to periods -->
<g transform="translate(1030 168)">
<ellipse rx="96" ry="118" class="skull" stroke-width="2"/>
<g filter="url(#glow)" transform="scale(1.6)" opacity=".9"><use href="#period" x="20" y="-22"/><use href="#period" transform="scale(-1 1)" x="20" y="-22"/></g>
<text y="148" class="lab" font-size="14" text-anchor="middle" letter-spacing="1">ABNORMAL · PERIODS</text>
</g>

<text x="64" y="104" class="t" font-size="50" font-weight="700" letter-spacing="-1">DaT Parkinson's Challenge</text>
<text x="66" y="142" class="m" font-size="19">Reading DaT-SPECT brain scans: normal or abnormal</text>
<g font-size="15" font-weight="600">
<g transform="translate(64 176)">
<rect width="222" height="38" rx="19" class="chip" stroke-width="1.5"/>
<text x="20" y="24.5" class="chipt">65th, private leaderboard</text>
</g>
<g transform="translate(298 176)">
<rect width="212" height="38" rx="19" class="chip" stroke-width="1.5"/>
<text x="20" y="24.5" class="chipt">public log loss 0.2696</text>
</g>
<g transform="translate(522 176)">
<rect width="150" height="38" rx="19" class="chip" stroke-width="1.5"/>
<text x="20" y="24.5" class="chipt">built in one day</text>
</g>
</g>
<text x="66" y="262" class="m" font-size="15">DrivenData · SFMN and Health Data Hub · code-execution track, Sep 2026</text>
</g>
</svg>
